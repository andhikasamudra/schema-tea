root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -C backend -o ../tmp/db-library.exe ./cmd/db-library"
  bin = "tmp/db-library.exe"
  full_bin = "tmp/db-library.exe"
  include_ext = ["go", "json"]
  exclude_dir = [".git", "tmp", "node_modules", "dist"]
  exclude_regex = ["_test.go"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
